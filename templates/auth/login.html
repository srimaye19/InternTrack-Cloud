{% extends 'base.html' %}

{% block title %}Sign In | InternTrack{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 3rem auto;">
  <div class="card" style="padding: 2.25rem; box-shadow: var(--shadow-md);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="margin: 0 auto 1rem auto; width: 42px; height: 42px; font-size: 1.2rem;">IT</div>
      <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--navy-900);">Sign in to InternTrack</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.35rem;">Access your candidate portal or administrative console</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="name@domain.com" required autofocus>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem; padding: 0.7rem;">
        Sign In
      </button>
    </form>

    <div style="margin-top: 1.75rem; text-align: center; font-size: 0.875rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
      Don't have an account? <a href="{{ url_for('register') }}" style="font-weight: 600;">Create account</a>
    </div>
  </div>
</div>
{% endblock %}
