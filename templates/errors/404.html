{% extends 'base.html' %}

{% block title %}Page Not Found | InternTrack{% endblock %}

{% block content %}
<div class="card" style="max-width: 580px; margin: 4rem auto; text-align: center; padding: 3.5rem 1.5rem;">
  <div style="font-size: 3rem; margin-bottom: 1rem;">🔍</div>
  <h1 style="font-size: 1.85rem; font-weight: 800; color: var(--navy-900); margin-bottom: 0.5rem;">Page Not Found</h1>
  <p style="color: var(--text-muted); margin-bottom: 2rem;">
    The requested resource, internship posting, or document could not be located.
  </p>
  <div style="display: flex; justify-content: center; gap: 0.75rem;">
    <a href="{{ url_for('index') }}" class="btn btn-primary">Return Home</a>
    <a href="{{ url_for('internships_list') }}" class="btn btn-secondary">Explore Positions</a>
  </div>
</div>
{% endblock %}
