{% extends 'base.html' %}

{% block title %}System Error | InternTrack{% endblock %}

{% block content %}
<div class="card" style="max-width: 580px; margin: 4rem auto; text-align: center; padding: 3.5rem 1.5rem;">
  <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
  <h1 style="font-size: 1.85rem; font-weight: 800; color: var(--navy-900); margin-bottom: 0.5rem;">Internal Error</h1>
  <p style="color: var(--text-muted); margin-bottom: 2rem;">
    An unexpected condition occurred while processing your request. Our technical team has been alerted.
  </p>
  <div style="display: flex; justify-content: center; gap: 0.75rem;">
    <a href="{{ url_for('index') }}" class="btn btn-primary">Return Home</a>
  </div>
</div>
{% endblock %}
